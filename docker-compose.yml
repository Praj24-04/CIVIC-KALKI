# Local Postgres for the demo. Started by `npm run setup` (or `npm run db:up`).
# Data lives in the named volume; `docker compose down -v` deletes it.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: civic
      POSTGRES_PASSWORD: civic
      POSTGRES_DB: civic_kalki
    ports:
      - "5432:5432"
    volumes:
      - civic_kalki_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic -d civic_kalki"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  civic_kalki_db:
