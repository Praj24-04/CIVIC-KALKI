name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: civic
          POSTGRES_PASSWORD: civic
          POSTGRES_DB: civic_kalki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civic -d civic_kalki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Throwaway values for the CI database and test tokens only.
      DATABASE_URL: postgresql://civic:civic@localhost:5432/civic_kalki
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      NODE_ENV: test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check the schema matches the migrations
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Seed modules, demo accounts and demo records
        run: npm run seed:all

      - name: Run tests
        run: npm run test:ci

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
